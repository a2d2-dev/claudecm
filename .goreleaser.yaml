version: 2

project_name: claudecm

before:
  hooks:
    - go mod download

builds:
  - id: claudecm
    main: .
    binary: claudecm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/a2d2-dev/claudecm/pkg/version.Version={{ .Version }}
      - -X github.com/a2d2-dev/claudecm/pkg/version.Commit={{ .ShortCommit }}
      - -X github.com/a2d2-dev/claudecm/pkg/version.Date={{ .Date }}

archives:
  - id: claudecm
    ids:
      - claudecm
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^build:"
  groups:
    - title: Features
      regexp: "^feat"
      order: 0
    - title: Fixes
      regexp: "^fix"
      order: 1
    - title: Documentation
      regexp: "^docs"
      order: 2
    - title: Other
      order: 999
