version: 2

project_name: claudecm

before:
  hooks:
    - go mod download

builds:
  - id: claudecm
    main: .
    binary: claudecm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/a2d2-dev/claudecm/pkg/version.Version={{ .Version }}
      - -X github.com/a2d2-dev/claudecm/pkg/version.Commit={{ .ShortCommit }}
      - -X github.com/a2d2-dev/claudecm/pkg/version.Date={{ .Date }}

archives:
  - id: claudecm
    ids:
      - claudecm
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

brews:
  - name: claudecm
    ids:
      - claudecm
    repository:
      owner: a2d2-dev
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: a2d2-dev release bot
      email: release-bot@a2d2.dev
    commit_msg_template: "brew: update claudecm to {{ .Tag }}"
    homepage: "https://github.com/a2d2-dev/claudecm"
    description: "One-command switch between Claude Code and Codex CLI configurations."
    license: MIT
    skip_upload: auto
    install: |
      bin.install "claudecm"
    test: |
      system "#{bin}/claudecm", "version"
      system "#{bin}/claudecm", "--help"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^build:"
  groups:
    - title: Features
      regexp: "^feat"
      order: 0
    - title: Fixes
      regexp: "^fix"
      order: 1
    - title: Documentation
      regexp: "^docs"
      order: 2
    - title: Other
      order: 999
